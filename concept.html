<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Flower Lab system diagram: one plant, peristaltic pumps, an Orange Pi Zero 3, and a later camera that runs YOLO for leaf color and bloom tracking.">
  <title>Flower Lab — system diagram</title>
  <style>
    :root {
      --paper: #f3eee4;
      --sheet: #faf7f1;
      --ink: #1b2c24;
      --muted: #5c6b62;
      --line: #d5ccbb;
      --green: #234237;
      --brass: #9a7340;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(1000px 480px at 80% -10%, #efe4cf 0%, transparent 55%),
        var(--paper);
      font-family: "Avenir Next", "Avenir", "Segoe UI", sans-serif;
      font-size: 1.02rem;
      line-height: 1.45;
    }

    h1, h2 {
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .wrap {
      width: min(1180px, calc(100% - 2rem));
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 1.2rem 0 0.7rem;
    }

    .brand { display: flex; align-items: center; gap: 0.5rem; }

    .meta {
      margin: 0;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .intro {
      margin: 0 0 1rem;
      max-width: 40rem;
      color: var(--green);
    }

    .sheet {
      padding: 0.8rem;
      background: var(--sheet);
      border: 1px solid var(--line);
      outline: 1px solid var(--line);
      outline-offset: 5px;
      overflow-x: auto;
    }

    .drawing { width: 100%; min-width: 980px; height: auto; display: block; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.4rem;
      margin: 0.8rem 0 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .legend i {
      display: inline-block;
      width: 1.4rem;
      height: 0;
      border-top-width: 3px;
      border-top-style: solid;
      margin-right: 0.4rem;
      vertical-align: middle;
    }

    .fluid { border-top-color: #3d7f96; }
    .power { border-top-color: #c4623e; }
    .signal { border-top-color: #9a7340; border-top-style: dashed; }
    .logic { border-top-color: #2f6b46; }

    figcaption {
      margin: 0.7rem 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    footer {
      padding: 1.2rem 0 1.6rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    footer a { color: inherit; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M9 16c0-4 2.2-6.2 6.2-7.2C13.4 4.2 10.6 2 9 2 7.4 2 4.6 4.2 2.8 8.8 6.8 9.8 9 12 9 16z" fill="#2f6b46"/>
          <path d="M9 16V7" stroke="#234237" stroke-width="1"/>
        </svg>
        Flower Lab
      </div>
      <p class="meta">Diagram</p>
    </header>
    <p class="intro">One plant, the wet side that feeds it, and the dry side that decides. The Orange Pi Zero 3 never powers a pump or the light.</p>

    <figure class="sheet">
      <svg class="drawing" viewBox="0 0 1240 860" role="img" aria-labelledby="dTitle dDesc">
        <title id="dTitle">Flower Lab system diagram</title>
        <desc id="dDesc">A plant in a pot, fed by three peristaltic pumps through one drip line. An Orange Pi Zero 3 reads moisture on an ADS1115, NPK over USB-RS485, and a float and temperature on GPIO. A PCA9685 times a MOSFET board that switches a separate 12 volt supply. Later, a CSI camera on the same board runs a small YOLO model to track leaf color and bloom.</desc>

        <rect x="16" y="16" width="360" height="700" rx="8" fill="#f7f3ea" stroke="#d5ccbb"/>
        <rect x="400" y="16" width="360" height="700" rx="8" fill="#f7f3ea" stroke="#d5ccbb"/>

      <figcaption>Dose by pump time, then wait and read moisture again. The float switch stops a dry run. NPK only decides whether A or B pulses — it is not a tight loop. If the soil is already in range, neither pump runs. Later, a CSI camera on the Zero 3 runs a small YOLO model over the leaves: yellowing, browning, spots, and bloom stage. A frame every few minutes, not live video — the board has no NPU. Those events are posted too. The camera does not dose.</figcaption>
